[pytest]

log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s - [%(levelname)2s] - %(message)s
log_cli_date_format=%Y-%m-%d %H:%M:%S

log_file = logs.log
log_file_level = INFO
log_file_format = %(asctime)s - [%(levelname)2s] - %(message)s  - (%(filename)s:%(lineno)s)
log_file_date_format=%Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning:chromedriver



markers =
    # examples
    example: mark a test as an example
    allure: allure example test marker for checking functionality
    chromedriver

    # monitoring
    monitoring
    availability

    # tab
    archive
    external
    internal

    # page
    mainpage
    productpage
    settingspage
    adminpage
    catalogue
    navigationbar

    product_main
    product_metrics
    product_eco
    product_atomic
    product_techno
    product_projects
    product_mainpage
    product_mainpage

    # affects data
    affectable: do not run on prod !!!

    # feature
    search
    sort

    # action
    CRUD
    create
    read
    update
    delete
    action
    notification

    # part
    silly
    api
    ui
    manual
    #backend
    #frontend
    #integration

    # debug
    debug

    settings

    product_main
    product_metrics
    product_eco
    product_atomic
    product_techno
    product_projects
    product_mainpage
    product_mainpage

    # usage

    last
    lastv2
    excel
